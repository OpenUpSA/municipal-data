name: Deploy

on:
  push:
    branches:
      - master
      - staging

# Never cancel a deploy that is already running; queue instead.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/openupsa/municipal-data
  DOKKU_HOST: dokku11.openup.org.za

jobs:
  # Reuses .github/workflows/test.yml so a red build never reaches an app.
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Deploy by immutable digest rather than by the mutable branch tag, so the
      # app runs exactly the image these tests passed against.
      - name: Resolve image reference
        id: image
        run: echo "ref=${IMAGE_NAME}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'master' && 'production' || 'staging' }}
    env:
      DOKKU_APP: ${{ github.ref_name == 'master' && 'munimoney-prod-web' || 'munimoney-staging-web' }}
      IMAGE: ${{ needs.build.outputs.image }}
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/id_deploy
          echo "${{ secrets.DOKKU_SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          echo "${{ secrets.DOKKU_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy image to Dokku
        run: |
          set -euo pipefail
          echo "Deploying $IMAGE to $DOKKU_APP"
          ssh -i ~/.ssh/id_deploy -o IdentitiesOnly=yes \
            "dokku@${DOKKU_HOST}" \
            git:from-image "$DOKKU_APP" "$IMAGE"
